<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>in_shop</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7fa;color:#1f2330;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}.box{max-width:520px;margin:24px;padding:40px 28px;background:#fff;border:1px solid #f1dbe3;border-radius:22px;text-align:center;box-shadow:0 12px 36px rgba(80,30,50,.08)}h1{margin:0 0 12px;color:#e8336d;font-size:30px}p{margin:0;color:#5b6172;line-height:1.7}
</style>
</head>
<body>
<main class="box">
<h1>in_shop</h1>
<p>운영 관리 페이지는 비공개로 전환되었습니다.<br>이 저장소는 상품 이미지 제공 용도로만 사용됩니다.</p>
</main>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
if(window.caches){caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));});}
</script>
</body>
</html>
